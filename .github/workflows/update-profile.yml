name: Update active projects
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/update-profile.yml']
permissions:
  contents: write
concurrency:
  group: update-profile
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --test scripts/update-profile.test.mjs
      - run: node scripts/update-profile.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save the README and its website projection together
        run: |
          git diff --check
          git add README.md data/github-profile.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh active projects and contribution calendar'
          git push
